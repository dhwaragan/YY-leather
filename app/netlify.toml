# Cache static assets aggressively - reduces bandwidth and page load time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# API caching headers - reduce repeated Supabase downloads
[[headers]]
  for = "/api/orders"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/api/preorders"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[redirects]]
  from = "/api/razorpay/create-order"
  to = "/.netlify/functions/razorpay-create-order"
